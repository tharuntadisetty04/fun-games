<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>777 Lucky Slots</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <canvas id="bg-canvas"></canvas>

    <div class="vignette"></div>

    <canvas id="confetti-canvas"></canvas>

    <div class="win-flash" id="winFlash"></div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">🏆 LEADERBOARD</div>
        <div class="modal-list" id="modalList"></div>
        <div class="modal-close" id="modalClose">✕ CLOSE</div>
      </div>
    </div>

    <div class="scene">
      <div class="left-panel" id="leftPanel">
        <div class="name-box">
          <div class="panel-label">PLAYER NAME</div>
          <input
            class="name-input"
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="YOUR NAME"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="name-err" id="nameErr"></div>
        </div>

        <div class="score-display">
          <div class="score-label">YOUR SCORE</div>
          <div class="score-value" id="scoreVal">0</div>
          <div class="score-spins" id="scoreSpinsLeft">ENTER NAME TO START</div>
        </div>

        <div class="paytable-mini">
          <div class="panel-label">POINTS TABLE</div>
          <div class="pt-row">
            <div class="pt-syms">7 7 7</div>
            <div class="pt-pts jackpot">100 pts</div>
          </div>
          <div class="pt-row">
            <div class="pt-syms">💎💎💎</div>
            <div class="pt-pts">50 pts</div>
          </div>
          <div class="pt-row">
            <div class="pt-syms">⭐⭐⭐</div>
            <div class="pt-pts">40 pts</div>
          </div>
          <div class="pt-row">
            <div class="pt-syms">🔔🔔🔔</div>
            <div class="pt-pts">30 pts</div>
          </div>
          <div class="pt-row">
            <div class="pt-syms">🍒🍒🍒</div>
            <div class="pt-pts">20 pts</div>
          </div>
          <div class="pt-row" style="border: none">
            <div class="pt-syms">🍋🍋🍋</div>
            <div class="pt-pts">10 pts</div>
          </div>
        </div>

        <div class="leaderboard">
          <div class="panel-label">TOP PLAYERS</div>
          <div class="lb-top3" id="lbTop3">
            <div
              style="
                font-family: &quot;Bebas Neue&quot;, sans-serif;
                font-size: 0.6rem;
                letter-spacing: 2px;
                color: #2a2848;
                text-align: center;
                padding: 10px 0;
              "
            >
              NO SCORES YET
            </div>
          </div>
          <button class="view-all-btn" id="viewAllBtn">
            VIEW ALL PLAYERS ▸
          </button>
        </div>
      </div>

      <div class="machine-col">
        <div class="marquee">
          <div class="marquee-lights">
            <div class="marquee-light"></div>
            <div class="marquee-light"></div>
            <div class="marquee-light"></div>
            <div class="marquee-light"></div>
            <div class="marquee-light"></div>
            <div class="marquee-light"></div>
            <div class="marquee-light"></div>
          </div>
          <h1>777</h1>
          <div class="marquee-sub">Lucky Slots</div>
        </div>

        <div class="machine" id="machineBody">
          <div class="rivet tl"></div>
          <div class="rivet tr"></div>
          <div class="rivet bl"></div>
          <div class="rivet br"></div>

          <div class="reels-wrapper">
            <div class="reels-inner">
              <div class="reel-slot" id="reel0">
                <div class="reel-strip" id="strip0"></div>
              </div>
              <div class="reel-slot" id="reel1">
                <div class="reel-strip" id="strip1"></div>
              </div>
              <div class="reel-slot" id="reel2">
                <div class="reel-strip" id="strip2"></div>
              </div>
            </div>
            <div class="reel-labels">
              <div class="reel-lbl">REEL I</div>
              <div class="reel-lbl">REEL II</div>
              <div class="reel-lbl">REEL III</div>
            </div>
          </div>

          <div class="status-area">
            <div class="status-text idle" id="statusText">ENTER YOUR NAME!</div>
            <div class="win-pts" id="winPts"></div>
          </div>
        </div>

        <div class="bottom-panel" id="bottomPanel">
          <div class="spin-indicator">
            <div class="spin-dot" id="dot0"></div>
            <div class="spin-dot" id="dot1"></div>
            <div class="spin-dot" id="dot2"></div>
            <div class="spin-label">SPINS</div>
          </div>

          <button class="spin-btn" id="spinBtn" disabled>SPIN</button>

          <div class="bottom-lights">
            <div class="bottom-light"></div>
            <div class="bottom-light"></div>
            <div class="bottom-light"></div>
            <div class="bottom-light"></div>
            <div class="bottom-light"></div>
            <div class="bottom-light"></div>
            <div class="bottom-light"></div>
          </div>
        </div>
      </div>

      <div class="lever-col" id="leverCol">
        <div class="lever-housing" id="leverHousing">
          <div class="lever-track" id="leverTrack">
            <div class="lever-arm" id="leverArm">
              <div class="lever-mount"></div>
              <div class="lever-shaft"></div>
              <div class="lever-ball"></div>
            </div>
          </div>
          <div class="lever-label">PULL</div>
          <div class="lever-arrow" id="leverArrow">▼</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
